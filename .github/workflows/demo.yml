# Regenerates the README screenshots from a real bat, uncat and bat run whenever behaviour or the demo prompt changes, committing the fresh SVGs back.
name: demo

on:
  push:
    branches: [main]
    paths: [src/**, demo/**, scripts/demo.ts]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 10
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 26
          cache: pnpm
      - uses: actions/setup-go@v6
        with:
          go-version: stable
      - name: install bat and freeze
        run: |
          sudo apt-get update && sudo apt-get install -y bat
          sudo ln -sf /usr/bin/batcat /usr/local/bin/bat
          go install github.com/charmbracelet/freeze@latest
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm demo
      - name: commit refreshed screenshots
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/*.svg
          git diff --cached --quiet || (git commit -m "docs: refresh terminal demo" && git push)
