# Renders the README terminal demo into SMIL-animated SVG via HalFrgrd/evp
# and deploys it directly to GitHub Pages without polluting the git repository.
name: demo

on:
  push:
    branches: [master, main]
    paths:
      - 'src/**'
      - 'demo/**'
      - 'demo.tape'
      - 'package.json'
      - '.github/workflows/demo.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'demo-pages'
  cancel-in-progress: true

jobs:
  render-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 10

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '26'
          cache: 'pnpm'

      - name: Install bat
        run: |
          sudo apt-get update && sudo apt-get install -y bat
          sudo ln -sf /usr/bin/batcat /usr/local/bin/bat

      - name: Build CLI
        run: |
          pnpm install --frozen-lockfile
          pnpm build
          chmod +x dist/cli.mjs
          mkdir -p dist-pages

      - name: Render tape script via EVP
        uses: HalFrgrd/evp@v0.19.0
        env:
          CI: ''
          GITHUB_ACTIONS: ''
        with:
          script: demo.tape
          output: dist-pages/demo.svg

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist-pages

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Purge GitHub Camo Cache
        run: |
          CAMO_URLS=$(curl -sL "https://github.com/${{ github.repository }}" | grep -Eo 'https://camo\.githubusercontent\.com/[a-f0-9]+/[a-f0-9]+' | sort -u || true)
          for url in $CAMO_URLS; do
            curl -s -X PURGE "$url" > /dev/null
          done
